<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nappita.org</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>

    body {
      margin: 0;
      padding: 0;
    }
    
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-dark">
        <div class="container-fluid">
          <!-- Título -->
          <a class="navbar-brand text-light" href="#">nappiitawa.org</a>
          
          <!-- Imagen al lado del título -->
          <img src="your-image-url-here" alt="Logo" style="width: 40px; height: auto;" class="ms-2">
        </div>
  </nav>

  <h1 class="mb-4">Listado de Clientes</h1>

  <table class="table table-striped table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>DNI</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="customer-table-body">
      <!-- Los datos se insertarán aquí -->
    </tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("https://opulent-cod-5g4j4p6qr5gq34p4r-8085.app.github.dev/v1/api/customer")
        .then(response => response.json())
        .then(data => {
          const tbody = document.getElementById("customer-table-body");
          data.forEach(customer => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${customer.id}</td>
              <td>${customer.dni}</td>
              <td>${customer.firstName}</td>
              <td>${customer.lastName}</td>
              <td>${customer.state}</td>
              <td>
                <button class="btn btn-sm btn-danger" onclick="deleteCustomer(${customer.id})">Eliminar</button>
                <button class="btn btn-sm btn-success" onclick="restoreCustomer(${customer.id})">Restaurar</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(error => console.error("Error cargando clientes:", error));
    });

    function deleteCustomer(id) {
      fetch(`https://opulent-cod-5g4j4p6qr5gq34p4r-8085.app.github.dev/v1/api/customer/${id}/delete`, {
        method: "PATCH"
      }).then(() => location.reload());
    }

    function restoreCustomer(id) {
      fetch(`https://opulent-cod-5g4j4p6qr5gq34p4r-8085.app.github.dev/v1/api/customer/${id}/restore`, {
        method: "PUT"
      }).then(() => location.reload());
    }
  </script>

</body>
</html>
